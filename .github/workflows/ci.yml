# De wizard tegen het template op de versie uit template.json: geen em-dash, het controlescript
# loopt gelijk met het template, en de rooktest loopt alle pagina's door in een browser.
name: Wizard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wizard:
    name: De wizard doorlopen in een browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Haalt het template op de tag uit template.json op in .template/.
      - name: Het template ophalen
        run: node ci/template.mjs

      - name: Geen em-dash
        run: node ci/geen-em-dash.mjs

      - name: Controlescript gelijk met het template
        run: node --test ci/controle-laptop.test.mjs

      - run: pnpm exec playwright install --with-deps chromium

      - name: Wizard-rooktest
        run: node ci/wizard-smoke.mjs
